services:
  node:
    image: ghcr.io/ebla-network/ebla-node:ebla-stable
    restart: always
    ports:
      - "10002:10002"
      - "10002:10002/udp"
      - "7777:7777"
      - "8777:8777"
    entrypoint: /usr/bin/sh
    command: >
      -c "mkdir -p /opt/ebla_data/data &&
          eblad --chain testnet --wallet /opt/ebla_data/conf/wallet.json --config /opt/ebla_data/conf/testnet.json --data-dir /opt/ebla_data/data --overwrite-config --rpc.enable-test-rpc"
    volumes:
      - ./config:/opt/ebla_data/conf
      - ./data:/opt/ebla_data/data
  status-app:
    image: ghcr.io/ebla-network/ebla-node-status:ebla-stable
    environment:
      - NEXT_PUBLIC_RPC=http://node:7777
    restart: always
    depends_on:
      node:
        condition: service_started
    ports:
      - "3000:3000"
